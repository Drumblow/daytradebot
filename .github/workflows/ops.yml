name: Ops

# Operações no servidor, executadas pelo runner que vive DENTRO do app (ADR-013).
#
# Existe porque o acesso administrativo por SSH NAO sobrevive a um reboot: o
# usuario `trader` e o `sudoers.d` sao apagados pelo rugix, e o `umbrel` fica sem
# docker e sem sudo. O runner do app sobrevive — entao este workflow e a
# interface de operacao que continua funcionando depois de uma queda de energia.
#
# Diferente do host-check.yml, que so le, aqui as acoes MUDAM estado. Por isso
# cada uma e explicita e nenhuma roda automaticamente.

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'O que fazer no servidor'
        required: true
        type: choice
        options:
          - start-instances
          - stop-instances
          - backup
          - restart-app
          - logs-gateway
          - exposicao
          - logs-instancia
          - flatten
      simbolo:
        description: 'Simbolo para flatten (ex.: IWM)'
        required: false
        type: string
        default: ''
      confirmar:
        description: 'flatten: marque para ENVIAR a ordem de verdade'
        required: false
        type: boolean
        default: false
      instancia:
        description: 'Nome da instancia para logs-instancia (ex.: iwm-pullback)'
        required: false
        type: string
        default: 'iwm-pullback'

jobs:
  ops:
    runs-on: [self-hosted, linux, x64, home]
    steps:
      - name: ${{ inputs.acao }}
        run: |
          set -uo pipefail
          case "${{ inputs.acao }}" in

            start-instances|stop-instances|backup)
              # O scheduler e o dono da janela de pregao; chamamos a MESMA funcao
              # que o cron chama, para nao existir um segundo caminho de codigo.
              docker exec daytradebot_scheduler_1 \
                /usr/local/bin/scheduler.sh "${{ inputs.acao }}"
              ;;

            restart-app)
              # Recria os containers; util depois de mudar o compose no app-data.
              docker restart daytradebot_gateway_1 daytradebot_postgres_1
              ;;

            logs-gateway)
              docker logs daytradebot_gateway_1 --tail 60
              ;;

            logs-instancia)
              # O log da instancia e a unica fonte de algumas decisoes que NAO
              # viram linha no banco — a mais importante sendo "exposicao
              # existente; sem novo sinal", que interrompe o ciclo antes de
              # gravar o contexto de mercado.
              docker logs "daytradebot_${{ inputs.instancia }}_1" --tail 150
              ;;

            flatten)
              # Encerramento MANUAL de posicao no broker. Existe para o que a
              # automacao nao resolve de proposito: posicao que nenhuma
              # instancia rastreia (o flatten de fim de sessao so fecha o que a
              # propria instancia abriu).
              #
              # Sem `confirmar`, o comando apenas mostra o que faria — o proprio
              # binario recusa executar sem --confirm.
              if [ -z "${{ inputs.simbolo }}" ]; then
                echo "ERRO: informe o simbolo" >&2
                exit 1
              fi
              CONFIRM=""
              if [ "${{ inputs.confirmar }}" = "true" ]; then CONFIRM="--confirm"; fi
              docker run --rm --network host -e TRADER__IBKR__HOST=127.0.0.1 -e TRADER__IBKR__PORT=4002 -e TRADER__IBKR__CLIENT_ID=99 --entrypoint /opt/trader/bin/trader-cli ghcr.io/drumblow/trader-bot:latest flatten --provider ibkr --symbol "${{ inputs.simbolo }}" $CONFIRM
              ;;

            exposicao)
              # SO LE. Pergunta ao Gateway quais posicoes e ordens estao
              # realmente abertas na conta — coisa que o painel nao mostra,
              # porque ele le o banco e nunca o broker.
              #
              # Por que importa: exposicao que o bot nao rastreia trava o
              # simbolo na reconciliacao do live, em silencio. Foi o que deixou
              # as duas instancias de IWM sem avaliar nada entre 07/08 e
              # 03/09/2026.
              #
              # client_id 99 e o id reservado a DIAGNOSTICO MANUAL, declarado
              # no compose da store e coberto por teste no adapter: market data
              # usa 1..11, broker 101..111, poll 201..211. Nenhuma instancia
              # pode usar 99, entao ele nunca derruba sessao viva.
              #
              # `--provider ibkr` e obrigatorio: o flag tem default "simulated"
              # e sobrescreve TRADER_PROVIDER, entao sem ele o comando responde
              # com a conta simulada e o diagnostico fica inutil.
              docker run --rm --network host                 -e TRADER_PROVIDER=ibkr                 -e TRADER__IBKR__HOST=127.0.0.1                 -e TRADER__IBKR__PORT=4002                 -e TRADER__IBKR__CLIENT_ID=99                 --entrypoint /opt/trader/bin/trader-cli                 ghcr.io/drumblow/trader-bot:latest account --provider ibkr
              ;;
          esac

          echo
          echo "=== estado depois ==="
          docker ps -a --filter name=daytradebot_ --format '{{.Names}}\t{{.Status}}' | sort
