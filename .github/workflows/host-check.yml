name: Host check

# Diagnostico do servidor, rodando no runner que vive DENTRO do app (ADR-013).
#
# Existe por um motivo concreto: depois de um reboot o usuario `trader` e o
# `sudoers.d` dele sao apagados pelo rugix, e o acesso administrativo por SSH
# some junto. O runner do app sobrevive, entao este workflow e o jeito de
# inspecionar o host sem depender de senha — inclusive para provar que a app
# voltou sozinha depois de reiniciar.
#
# So le estado. Nao muda nada.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, linux, x64, home]
    steps:
      - name: Estado dos containers
        run: |
          echo "=== uptime do host ==="
          docker run --rm --pid=host --privileged alpine:3.20 \
            sh -c 'cat /proc/uptime | cut -d. -f1 | xargs -I{} sh -c "echo {} segundos desde o boot"' \
            2>/dev/null || echo "(nao consegui ler o uptime)"

          echo
          echo "=== containers da app ==="
          docker ps -a --filter name=daytradebot_ --format '{{.Names}}\t{{.Status}}' | sort

          echo
          echo "=== resumo ==="
          up=$(docker ps --filter name=daytradebot_ -q | wc -l)
          echo "containers rodando: $up"
          for c in postgres gateway scheduler runner; do
            st=$(docker inspect -f '{{.State.Running}}' "daytradebot_${c}_1" 2>/dev/null || echo ausente)
            printf '  %-10s running=%s\n' "$c" "$st"
          done

      - name: Gateway e banco
        run: |
          echo "=== API do Gateway (4002) ==="
          docker run --rm --network host alpine:3.20 \
            sh -c 'nc -z 127.0.0.1 4002 && echo "4002 aberta" || echo "4002 FECHADA"'

          echo
          echo "=== contagens do banco ==="
          docker exec daytradebot_postgres_1 psql -U trader -p 5433 -d trader_db -tAc \
            "select 'signals', count(*) from signals
             union all select 'orders', count(*) from orders
             union all select 'fills', count(*) from fills
             union all select 'trades', count(*) from trades
             union all select 'candles', count(*) from candles" \
            || echo "banco inacessivel"

      - name: Auditoria do painel (mesmas agregacoes do trader-web)
        run: |
          # Espelha as queries do painel (crates/trader-web/src/queries.rs) para
          # conferir de um clique se o que a UI mostra bate com o banco real.
          docker exec daytradebot_postgres_1 psql -U trader -p 5433 -d trader_db -c \
            "SELECT count(*) AS trades,
                    count(*) FILTER (WHERE net_pnl > 0) AS wins,
                    round(sum(net_pnl), 2) AS net_pnl,
                    round(sum(result_in_r), 2) AS sum_r
             FROM trades" \
            -c \
            "SELECT t.id, a.symbol, t.strategy_id, t.direction,
                    t.exit_time AT TIME ZONE 'America/New_York' AS exit_et,
                    round(t.net_pnl, 2) AS net_pnl,
                    round(t.result_in_r, 2) AS r, t.exit_reason
             FROM trades t JOIN assets a ON a.id = t.asset_id
             ORDER BY t.exit_time" \
            -c \
            "SELECT strategy_id,
                    count(*) FILTER (WHERE status = 'accepted') AS accepted,
                    count(*) FILTER (WHERE status = 'rejected') AS rejected
             FROM signals GROUP BY 1 ORDER BY 1" \
            -c \
            "SELECT count(*) FILTER (WHERE (created_at AT TIME ZONE 'America/New_York')::date
                                           = (now() AT TIME ZONE 'America/New_York')::date) AS open_today,
                    count(*) FILTER (WHERE (created_at AT TIME ZONE 'America/New_York')::date
                                           < (now() AT TIME ZONE 'America/New_York')::date) AS open_stale
             FROM orders
             WHERE status::text IN ('pending','submitted','accepted','partially_filled')" \
            -c \
            "SELECT max(\"timestamp\") AS last_candle_utc FROM candles"

      - name: Agenda do scheduler
        run: docker logs daytradebot_scheduler_1 2>&1 | head -8
