name: Build images

# Publica as imagens do app do umbrelOS (ADR-013) em ghcr.io.
#
# Diferente do deploy.yml (que copia um binario para /data/trader no host via
# runner self-hosted), aqui o artefato e a IMAGEM. O host so precisa dar pull.
#
# NENHUMA imagem publicada aqui pode conter segredo:
#   - trader-gateway: sem ibc.ini preenchido, sem instalador da IBKR
#   - trader-bot: so binario + config de estrategia (que ja sao publicos no repo)
# Ver docs/decisions/ADR-013-app-umbrelos.md, secao 5.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'config/**'
      - 'deploy/images/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      # O sqlx valida query em tempo de compilacao — o build precisa do banco.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader_secret
          POSTGRES_DB: trader_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://trader:trader_secret@localhost:5432/trader_db

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations
        run: sqlx migrate run --source crates/trader-infra/src/db/migrations

      - name: Build release binary
        run: cargo build --release -p trader-cli

      - name: Assemble build context
        run: |
          strip target/release/trader-cli
          cp target/release/trader-cli deploy/images/bot/
          cp -r config deploy/images/bot/config

      # O cache type=gha exige o driver docker-container do buildx; sem isto o
      # build morre com "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — nenhum segredo no contexto de build
        run: |
          # A imagem e publica. Duas checagens, das mais para as menos obvias.
          #
          # (1) Arquivo de segredo entrando no contexto por descuido — e o jeito
          #     mais provavel de vazar, porque basta um `cp` errado.
          achados=$(find deploy/images/bot -type f \(                       -name '*.env' -o -name 'ibc.ini' -o -name '*.pem'                       -o -name '*.key' -o -name '*.jks' \) 2>/dev/null)
          if [ -n "$achados" ]; then
            echo "ERRO: arquivo de segredo no contexto de build:" >&2
            echo "$achados" >&2
            exit 1
          fi

          # (2) Credencial escrita inline. Placeholders de documentacao (<...>,
          #     ${VAR}) nao contam — foi exatamente esse falso positivo que
          #     derrubou o build em 2026-08-28: a mensagem de ajuda do
          #     entrypoint ensina a preencher TWSPASSWORD e o grep ingenuo
          #     achou que era a senha.
          if grep -rInE '(IbPassword|IbLoginId|TWSPASSWORD|TWSUSERID)=[^[:space:]]+'                deploy/images/ 2>/dev/null              | grep -vE '=[<$"]' ; then
            echo "ERRO: credencial escrita inline no contexto de build" >&2
            exit 1
          fi
          echo "contexto limpo"

      - uses: docker/build-push-action@v6
        with:
          context: deploy/images/bot
          push: true
          tags: |
            ${{ env.REGISTRY }}/drumblow/trader-bot:latest
            ${{ env.REGISTRY }}/drumblow/trader-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # O cache type=gha exige o driver docker-container do buildx; sem isto o
      # build morre com "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — ibc.ini sem credencial
        run: |
          # A imagem e publica e o ibc.ini vai dentro dela. Estes dois campos
          # PRECISAM estar vazios: o IBC le TWSUSERID/TWSPASSWORD do ambiente.
          if grep -qE '^(IbLoginId|IbPassword)=.+' deploy/images/gateway/ibc.ini; then
            echo "ERRO: ibc.ini tem credencial preenchida — nao publicar" >&2
            exit 1
          fi
          echo "ibc.ini limpo"

      - uses: docker/build-push-action@v6
        with:
          context: deploy/images/gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/drumblow/trader-gateway:latest
            ${{ env.REGISTRY }}/drumblow/trader-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scheduler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # O cache type=gha exige o driver docker-container do buildx; sem isto o
      # build morre com "Cache export is not supported for the docker driver".
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/images/scheduler
          push: true
          tags: |
            ${{ env.REGISTRY }}/drumblow/trader-scheduler:latest
            ${{ env.REGISTRY }}/drumblow/trader-scheduler:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/images/runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/drumblow/trader-runner:latest
            ${{ env.REGISTRY }}/drumblow/trader-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Painel web (ADR-014). Diferente do job `bot`, nao precisa de Postgres:
  # trader-web usa sqlx em runtime (sem macros query!), entao compila sem banco.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p trader-web

      - name: Assemble build context
        run: |
          strip target/release/trader-web
          cp target/release/trader-web deploy/images/web/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/images/web
          push: true
          tags: |
            ${{ env.REGISTRY }}/drumblow/trader-web:latest
            ${{ env.REGISTRY }}/drumblow/trader-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy: roda no runner self-hosted que vive DENTRO do app. Ele fala com o
  # daemon do host pelo socket montado, entao os caminhos do compose (que sao
  # caminhos do host) resolvem corretamente.
  #
  # So as 11 instancias sao recriadas (--no-deps): postgres e gateway ficam de
  # pe. Fora do pregao as instancias sobem com a imagem nova e saem sozinhas
  # pela guarda de janela, ficando paradas ate as 9h25 — que e o desejado.
  deploy:
    needs: [bot, gateway, scheduler, runner, web]
    # Ligado so depois do cutover (`gh variable set APP_DEPLOY --body enabled`).
    # Antes disso o runner self-hosted ainda e o antigo, do systemd, que nao tem
    # APP_DATA_DIR — sem esta trava o job falharia em todo push ate o cutover.
    if: vars.APP_DEPLOY == 'enabled'
    runs-on: [self-hosted, linux, x64, home]
    steps:
      - name: Recriar instancias com a imagem nova
        run: |
          set -euo pipefail
          : "${APP_DATA_DIR:?o container do runner precisa receber APP_DATA_DIR}"

          INSTANCIAS="iwm-pullback iwv-pullback iwo-pullback ijs-balance
                      vbr-balance avuv-balance iwm-openrev iwn-openrev
                      avuv-rangefade slyv-rangefade iwv-rangefade"

          docker pull ghcr.io/drumblow/trader-bot:latest
          docker pull ghcr.io/drumblow/trader-scheduler:latest

          # O painel so entra se o compose instalado no host ja o declarar —
          # o app da store pode estar uma versao atras do repositorio do bot.
          EXTRAS=""
          if docker compose -p daytradebot -f /appdata/docker-compose.yml config --services | grep -qx web; then
            docker pull ghcr.io/drumblow/trader-web:latest
            EXTRAS="web"
          fi

          # O scheduler entra junto: e sem estado e recria-lo no meio do pregao
          # nao toca nas instancias. O GATEWAY fica de fora de proposito —
          # recria-lo derruba a sessao da IBKR, que e unica por usuario.
          docker compose -p daytradebot -f /appdata/docker-compose.yml             up -d --no-deps $INSTANCIAS scheduler $EXTRAS

          echo "--- estado apos o deploy ---"
          docker ps -a --filter name=daytradebot_ --format '{{.Names}}	{{.Status}}'
