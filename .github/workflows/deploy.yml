name: Deploy VM

# Deploy do servidor de producao paper (host umbrelOS da casa, ADR-012).
# Roda os mesmos checks do CI, compila o binario release para Linux e publica
# via SSH. O bot roda em containers Docker (compose em /data/trader):
#   - o binario e as configs sao montados por volume (/data/trader/bin e /config)
#   - o restart e condicional: so reinicia containers RUNNING (fora do pregao
#     as instancias estao stopped — o compose restart nao as liga)
#   - as units systemd/timers (home) sao reinstaladas (idempotente)

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'config/**'
      - 'deploy/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://trader:trader_secret@localhost:5432/trader_db

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader_secret
          POSTGRES_DB: trader_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres

      - name: Run migrations
        run: sqlx migrate run --source crates/trader-infra/src/db/migrations

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: vm-production

    services:
      # sqlx valida queries em tempo de compilação — o build precisa do banco.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader_secret
          POSTGRES_DB: trader_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run migrations
        run: sqlx migrate run --source crates/trader-infra/src/db/migrations

      - name: Build release binary
        run: cargo build --release -p trader-cli

      - name: Package binary and configs
        run: |
          strip target/release/trader-cli
          mkdir -p /tmp/pkg/bin
          cp target/release/trader-cli /tmp/pkg/bin/
          cp -r config /tmp/pkg/
          cp -r deploy/scripts deploy/home /tmp/pkg/
          tar czf trader-deploy.tar.gz -C /tmp/pkg .

      - name: Setup SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload package
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: scp -i ~/.ssh/deploy_key trader-deploy.tar.gz "$VM_USER@$VM_HOST:/tmp/trader-deploy.tar.gz"

      - name: Deploy and conditional restart
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" 'sudo bash -se' <<'EOF'
          set -e
          cd /tmp
          rm -rf trader-deploy && mkdir trader-deploy
          tar xzf trader-deploy.tar.gz -C trader-deploy
          # binario atomico: escreve .new e move por cima (containers ativos seguem no inode antigo)
          install -o trader -g trader -m 755 trader-deploy/bin/trader-cli /data/trader/bin/trader-cli.new
          mv /data/trader/bin/trader-cli.new /data/trader/bin/trader-cli
          # configs (sem sobrescrever ajustes locais de porta do default.toml do host)
          rsync -a --delete trader-deploy/config/strategies/ /data/trader/config/strategies/ 2>/dev/null || cp -r trader-deploy/config/strategies/. /data/trader/config/strategies/
          install -o trader -g trader -m 644 trader-deploy/config/default.toml /data/trader/config/default.toml 2>/dev/null || true
          chown -R trader:trader /data/trader/bin /data/trader/config
          # scripts
          install -o trader -g trader -m 755 trader-deploy/home/backup.sh /data/trader/bin/backup.sh
          install -o trader -g trader -m 755 trader-deploy/home/trader-containers.sh /data/trader/bin/trader-containers.sh
          # units systemd/timers do host (start/stop/backup via docker)
          install -o root -g root -m 644 trader-deploy/home/systemd/trader-start.timer trader-deploy/home/systemd/trader-start.service trader-deploy/home/systemd/trader-stop.timer trader-deploy/home/systemd/trader-stop.service trader-deploy/home/systemd/trader-backup.timer trader-deploy/home/systemd/trader-backup.service -t /etc/systemd/system/
          systemctl daemon-reload
          systemctl enable --now trader-start.timer trader-stop.timer trader-backup.timer >/dev/null 2>&1 || true
          # restart condicional: so containers RUNNING (fora do pregao, stopped nao liga)
          restarted=""
          for c in $(cd /data/trader && docker compose ps --status running --format '{{.Name}}' | grep '^trader-' | grep -vE 'gateway|postgres' || true); do
            docker restart "$c" >/dev/null 2>&1
            restarted="$restarted $c"
          done
          echo "containers reiniciados:${restarted:- nenhum (fora do pregao)}"
          EOF