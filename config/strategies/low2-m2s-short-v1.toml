[strategy]
id = "low2-m2s-short-v1"
version = "1.0.0"
source = "Al Brooks - Reading Price Charts Bar by Bar, Cap. 4 (Low 2 / M2S)"

[strategy.parameters]
# Timeframes
operational_timeframe = "15m"
context_timeframe = "1h"
macro_timeframe = "1d"

# Contexto: tendência de baixa (espelho da pullback-trend-v1)
min_candles_below_ema20 = 10
ema_context_period = 20
sma_context_period = 200

# Setup: pullback (correção para cima) de 2 pernas + barra de sinal bear
max_pullback_candles = 5
min_signal_body_ratio = 1.5
signal_close_position = "lower_third"

# Entrada, stop e alvo (seção 6 do doc; literal Cap. 10)
entry_offset_ticks = 1
stop_offset_ticks = 1
reward_multiple = 2
entry_order_type = "stop"
# Candles de validade da entrada stop esperando o rompimento (ADR-009)
entry_validity_candles = 2

# Risco: usa o [risk].risk_per_trade_pct global (1,0) — sem override
max_spread_pct = 0.05
max_atr_pct = 1.5
min_risk_reward = 2

# Precisão do ativo
tick_size = 0.01

# Horário (UTC) — janela 09:45–15:15 ET (mesma das irmãs).
#   - Horário de verão americano (mar–nov): 13:45–19:15 UTC  ← ATUAL
#   - Horário de inverno americano (nov–mar): 14:45–20:15 UTC
trading_start_time = "13:45:00"
trading_end_time = "19:15:00"
