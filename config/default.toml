[app]
name = "HumanStyle Trader Bot"
mode = "paper"
paper_warning = true

[database]
# Deve ser sobrescrito via variável de ambiente TRADER__DATABASE__URL ou DATABASE_URL.
url = ""

[broker]
name = "ibkr"
paper = true
# Preencher se usar Client Portal API; para TWS/IB Gateway use [ibkr].
account_id = ""
api_url = ""
client_id = ""

[ibkr]
# Configuração do IB Gateway / TWS API.
host = "127.0.0.1"
port = 7497
client_id = 1
paper = true
account_id = ""

[risk]
profile = "conservative"
# Limites diários e por trade (percentuais do capital).
risk_per_trade_pct = 1.0
max_daily_loss_pct = 2.0
max_trades_per_day = 3
max_consecutive_losses = 3

[alerts]
# Webhook para alertas críticos (Slack/Discord/Teams: POST {"text": "..."}).
# Vazio = apenas logs.
webhook_url = ""

[logging]
level = "info"
format = "pretty"
