[app]
name = "HumanStyle Trader Bot"
mode = "paper"
paper_warning = true

[database]
# Deve ser sobrescrito via variável de ambiente TRADER__DATABASE__URL ou DATABASE_URL.
url = ""

[broker]
name = "ibkr"
paper = true
# Preencher se usar Client Portal API; para TWS/IB Gateway use [ibkr].
account_id = ""
api_url = ""
client_id = ""

[ibkr]
# Configuração do IB Gateway / TWS API.
host = "127.0.0.1"
port = 7497
client_id = 1
paper = true
account_id = ""

[risk]
profile = "conservative"
# Limites diários e por trade (percentuais do capital).
risk_per_trade_pct = 1.0
max_daily_loss_pct = 2.0
max_trades_per_day = 3
max_consecutive_losses = 3
# Limites da CONTA INTEIRA (C2 da auditoria). Os de cima valem por instancia;
# com 11 instancias na mesma conta a perda efetiva era 11x o configurado.
# Nenhuma instancia abre posicao depois que um destes e atingido.
max_portfolio_daily_loss_pct = 4.0
max_concurrent_positions = 3
max_portfolio_notional_pct = 200.0
# Tolerância de overshoot numa entrada stop, como fração da distância do stop
# (0.25 = aceita até 25% de risco extra; além disso a entrada é invalidada em
# vez de perseguida). Vale para live, replay e backtest — ADR-015.
entry_overshoot_tolerance = 0.25

[alerts]
# Webhook para alertas críticos. O formato do corpo é detectado pela URL:
#   Discord  -> {"content": "..."}   (URL discord.com/api/webhooks/...)
#   Slack    -> {"text": "..."}      (e o endpoint .../slack do Discord)
# Vazio = apenas logs. Em produção o valor NÃO vem daqui: o entrypoint do
# bot carrega TRADER__ALERTS__WEBHOOK_URL de secrets/alerts.env (ADR-013).
webhook_url = ""

[logging]
level = "info"
format = "pretty"
