[package]
name = "trader-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "trader-cli"
path = "src/main.rs"

[dependencies]
# `--set` do ADR-019 muta o TOML da estrategia antes do load_strategy.
toml = "0.8"
trader-domain = { path = "../trader-domain" }
trader-core = { path = "../trader-core" }
trader-infra = { path = "../trader-infra" }
trader-adapters = { path = "../trader-adapters" }
trader-backtest = { path = "../trader-backtest" }

chrono = { workspace = true }
chrono-tz = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
sqlx = { workspace = true }
config = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
