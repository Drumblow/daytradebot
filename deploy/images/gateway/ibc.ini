# Configuracao do IBC para o app do umbrelOS (ADR-013).
#
# ATENCAO: este arquivo entra numa imagem PUBLICA. IbLoginId e IbPassword ficam
# VAZIOS de proposito — quando estao em branco o IBC usa TWSUSERID/TWSPASSWORD
# do ambiente, que o entrypoint carrega de ${APP_DATA_DIR}/secrets/ibkr.env no
# dispositivo do usuario. Nunca preencha credencial aqui.
#
# Valores herdados da instalacao validada na VM Oracle e no servidor de casa.

FIX=no
IbLoginId=
IbPassword=
FIXLoginId=
FIXPassword=

# ── segundo fator ────────────────────────────────────────────────────────────
# Conta paper sem 2FA. Se o 2FA expirar, sair e melhor que ficar num dialogo
# invisivel dentro do Xvfb: o container reinicia e o circuit breaker do bot ve.
SecondFactorDevice=
ReloginAfterSecondFactorAuthenticationTimeout=no
SecondFactorAuthenticationExitInterval=
SecondFactorAuthenticationTimeout=180
ExitAfterSecondFactorAuthenticationTimeout=no

# ── sessao ───────────────────────────────────────────────────────────────────
TradingMode=paper
AcceptNonBrokerageAccountWarning=yes
LoginDialogDisplayTimeout=60
IbDir=/opt/trader/gateway-settings
StoreSettingsOnServer=no
MinimizeMainWindow=yes
# 'primary' faz esta sessao tomar o lugar de outra. Ver docs/HANDOFF.md: NUNCA
# abrir o TWS/Gateway com o mesmo usuario em outro lugar — derruba as instancias.
ExistingSessionDetectedAction=primary

# ── API ──────────────────────────────────────────────────────────────────────
OverrideTwsApiPort=4002
OverrideTwsMasterClientID=
ReadOnlyLogin=no
ReadOnlyApi=no
AcceptIncomingConnectionAction=accept
AllowBlindTrading=no
TrustedTwsApiClientIPs=

# ── avisos e confirmacoes ────────────────────────────────────────────────────
BypassOrderPrecautions=
BypassBondWarning=
BypassNegativeYieldToWorstConfirmation=
BypassCalledBondWarning=
BypassSameActionPairTradeWarning=
BypassPriceBasedVolatilityRiskWarning=
BypassUSStocksMarketDataInSharesWarning=
BypassRedirectOrderWarning=
BypassNoOverfillProtectionPrecaution=
AcceptBidAskLastSizeDisplayUpdateNotification=
SendMarketDataInLotsForUSstocks=
ConfirmCryptoCurrencyOrders=manual
DismissPasswordExpiryWarning=no
DismissNSEComplianceNotice=yes

# ── reinicios ────────────────────────────────────────────────────────────────
# Todos vazios: quem controla a janela de pregao e o scheduler da app, nao o IBC.
ResetOrderIdsAtStart=
ConfirmOrderIdReset=
AutoLogoffTime=
AutoRestartTime=
ColdRestartTime=
ClosedownAt=
SaveTwsSettingsAt=

# ── command server (desligado) ───────────────────────────────────────────────
CommandServerPort=0
ControlFrom=
BindAddress=
CommandPrompt=
SuppressInfoMessages=yes

# ── log ──────────────────────────────────────────────────────────────────────
LogStructureScope=known
LogStructureWhen=never
IncludeStackTraceForExceptions=
