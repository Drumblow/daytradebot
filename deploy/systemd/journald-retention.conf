# Retenção explícita do journal da VM de produção paper.
# Motivo: com os defaults (Storage=auto sem limites), os logs anteriores a
# 2026-08-16 foram perdidos na VM — sem eles, o diagnóstico de incidentes
# fica dependente só da tabela system_events. Ver docs/reports/day9-2026-08-14.md §4.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemMaxFileSize=100M
MaxRetentionSec=21day
